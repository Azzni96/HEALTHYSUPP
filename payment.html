<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button id="proceed-payment">Jatka maksamaan</button>

<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe('YOUR_TEST_PUBLIC_STRIPE_KEY'); // Vaihda 'pk_test_...' avain
  document.getElementById('proceed-payment').addEventListener('click', async () => {
    const response = await fetch('/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: 5000 }) // Tässä 5000 tarkoittaa 50.00 USD
    });

    const session = await response.json();
    await stripe.redirectToCheckout({ sessionId: session.id });
  });
</script>

</body>
</html>
