<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="/src/payment.ts"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .payment-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 400px;
            padding: 20px;
        }

        .payment-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .payment-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .payment-form label {
            font-size: 14px;
            color: #555;
        }

        .payment-form input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .payment-form button {
            background: linear-gradient(45deg, blueviolet, deeppink);
            color: white;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .payment-form button:hover {
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .confirmation {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .confirmation a {
            color: blueviolet;
            text-decoration: none;
            font-weight: bold;
        }

        .confirmation a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>Complete Payment</h1>
        <form id="payment-form" class="payment-form">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required maxlength="16">

            <label for="card-name">Cardholder Name</label>
            <input type="text" id="card-name" placeholder="John Doe" required>

            <label for="card-expiration">Expiration Date</label>
            <input type="text" id="card-expiration" placeholder="MM/YY" required pattern="\d{2}/\d{2}">

            <label for="card-cvv">CVV</label>
            <input type="text" id="card-cvv" placeholder="123" required maxlength="4">

            <label for="card-postal-code">Postal Code</label>
            <input type="text" id="card-postal-code" placeholder="12345" required maxlength="6">

            <button type="submit">Pay Now</button>
        </form>

        <div class="confirmation">
            <p>By clicking "Pay Now," you agree to our <a href="#">Terms & Conditions</a>.</p>
        </div>
    </div>
</body>
</html>
