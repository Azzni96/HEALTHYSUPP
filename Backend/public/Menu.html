<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/healthy-ad-nCldX.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Example Vite PWA">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" sizes="192x192">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Product Details - HEALTHYSUPP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" crossorigin src="./assets/main-D3CmH4up.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/menu-yvii6A7q.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body class="bg-white text-gray-900">
    <header class="header flex justify-between items-center p-4 bg-gray-100">
        <a href="index.html" class="logo">
          <img class="healthySuppLogo h-10" src="./assets/healthysupp_logoff-n7rpy2c_.jpg" alt="logo">
        </a>
        <nav class="navbar flex space-x-4">
          <a href="index.html" class="text-gray-700 hover:text-gray-900">Home</a>
          <a href="Menu.html" class="text-gray-700 hover:text-gray-900">Shopping</a>
          <a href="index.html#about" class="text-gray-700 hover:text-gray-900">About</a>
          <a href="index.html#contact" class="text-gray-700 hover:text-gray-900">Contact</a>
        </nav>
        <div class="icons flex items-center space-x-4">
          <div class="fas fa-user cursor-pointer" id="user-btn"></div>
          <div class="fas fa-shopping-cart cursor-pointer" id="cart-btn"></div>
          <span class="quantity text-sm bg-red-500 text-white rounded-full px-2">0</span>
          <div class="fas fa-search cursor-pointer" id="search-btn"></div>
          <div class="fas fa-bars cursor-pointer" id="menu-btn"></div>
        </div>
        <div class="search-form hidden">
          <input type="search" id="search-bar" placeholder="search here..." class="border p-2 rounded">
          <label for="search-box" class="fas fa-search"></label>
        </div>
        <div class="cart-items-container hidden">
          <h1>Card</h1>
          <ul class="listCard"></ul>
          <div class="cart-actions flex space-x-2">
            <button id="clear-cart" class="bg-gray-500 text-white px-4 py-2 rounded">Tyhjennä Ostoskori</button>
            <button id="checkout" class="bg-green-500 text-white px-4 py-2 rounded">Maksaminen</button>
          </div>
          <div class="checkOut">
            <div class="total">0</div>
            <div class="closeShopping cursor-pointer">Close</div>
          </div>
        </div>
    </header>
    <section class="menu p-4" id="menu">
      <h1 class="heading text-2xl font-bold"><span>Our Menu</span></h1>
      <div id="List" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
        <div class="Menu" data-category="creatine">
          <p class="Menu-name text-lg font-semibold">CREATINE</p>
          <img src="./assets/creatine2-BwLFJmKR.png" alt="Creatine" class="Menu-image w-full h-auto">
        </div>
        <div class="Menu" data-category="energy">
          <p class="Menu-name text-lg font-semibold">ENERGY</p>
          <img src="./assets/energy-B3ybbMda.png" alt="Energy" class="Menu-image w-full h-auto">
        </div>
        <div class="Menu" data-category="muscle">
          <p class="Menu-name text-lg font-semibold">MUSCLE</p>
          <img src="./assets/Muscle-D1415m0q.png" alt="Muscle" class="Menu-image w-full h-auto">
        </div>
        <div class="Menu" data-category="best product">
          <p class="Menu-name text-lg font-semibold">Best product</p>
        </div>
      </div>
    </section>
    <section class="p-4">
      <div id="product-list"></div> <!-- For the single selected product -->
    </section>
    <footer class="bg-gray-100 p-4 mt-4">
      <div class="footer-container flex justify-between items-center">
        <div class="footer-logo">
          <img src="./assets/healthysupp_logoff-n7rpy2c_.jpg" alt="logo" class="h-10">
        </div>
        <div class="footer-social flex space-x-4">
          <a href="#"><img src="./assets/facebook-ejnf6rkB.png" alt="Facebook" class="h-8"></a>
          <a href="#"><img src="./assets/twitter-CPWSm0NQ.png" alt="X (formerly Twitter)" class="h-8"></a>
          <a href="#"><img src="./assets/instagram-BT1rpC5A.png" alt="Instagram" class="h-8"></a>
          <a href="#"><img src="./assets/linkedin-DYsRWqBD.png" alt="LinkedIn" class="h-8"></a>
        </div>
        <div class="footer-text">
          <p class="text-gray-700">
            &copy; 2021 HEALTHYSUPP. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
