<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Example Vite PWA">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" sizes="192x192">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Product Details - HEALTHYSUPP</title> <!-- Include the cartAndProduct script -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://js.stripe.com/v3/"></script> <!-- Include Stripe.js library -->
    <script type="module" crossorigin src="./assets/main-Ba8Nt-5-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DSwa66gG.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <header class="header">
        <a href="index.html" class="logo">
          <img src="./assets/healthysupp_logoff-n7rpy2c_.jpg" alt="logo">
        </a>
        <nav class="navbar">
          <a href="index.html">Home</a>
          <a href="Menu.html">Shopping</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <div class="icons">

          <div class="fas fa-shopping-cart" id="cart-btn"></div>
          <span class="quantity">0</span>
          <div class="fas fa-search" id="search-btn"></div>
          <div class="fas fa-bars" id="menu-btn"></div>

        </div>
        <div class="search-form">
          <input type="search" id="search-box" placeholder="search here...">
          <label for="search-box" class="fas fa-search"></label>
        </div>
        <div class="cart-items-container">
          <h1>Card</h1>
          <ul class="listCard"></ul>
          <div class="cart-actions">
            <button id="clear-cart">Clear Cart</button>
            <button id="checkout-button">Checkout</button>
          </div>
          <div class="checkOut">
            <div class="total">0</div>
            <div class="closeShopping">Close</div>
          </div>
        </div>
    </header>

    <section>
      <div id="product-list"></div> <!-- For the single selected product -->

    </section>

    <section class="menu" id="menu">
      <h1 class="heading"><span>Our Menu</span></h1>
      <div id="List">
        <div class="Menu" data-category="creatine" onclick="location.href='Menu.html?category=creatine'">
          <p class="Menu-name">CREATINE</p>
          <i class="fas fa-dumbbell"></i>
        </div>
        <div class="Menu" data-category="energy" onclick="location.href='Menu.html?category=energy'">
          <p class="Menu-name">ENERGY</p>
          <i class="fas fa-bolt"></i>
        </div>
        <div class="Menu" data-category="muscle" onclick="location.href='Menu.html?category=muscle'">
          <p class="Menu-name">MUSCLE</p>
          <i class="fas fa-dumbbell"></i>
        </div>
      </div>
    </section>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const clearCartButton = document.getElementById('clear-cart');
        const checkoutButton = document.getElementById('checkout-button');

        if (clearCartButton) {
          clearCartButton.addEventListener('click', () => {
            clearCart(); // Call the `clearCart` function on button click
          });
        } else {
          console.error('Clear Cart button not found');
        }

        if (checkoutButton) {
          checkoutButton.addEventListener('click', async () => {
            try {
              const cartItems = JSON.parse(localStorage.getItem('cart')) || {};
              const items = Object.values(cartItems).map(item => ({
                productName: item.name,
                amount: parseInt(item.price, 10) * parseInt(item.quantity, 10), // Ensure amount is an integer
                quantity: parseInt(item.quantity, 10) // Ensure quantity is an integer
              }));

              const response = await fetch("http://localhost:3000/create-checkout-session", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ items }), // Send cart items to the server
              });

              if (!response.ok) {
                const errorResponse = await response.json();
                console.error('Server error response:', errorResponse);
                throw new Error('Network response was not ok');
              }

              const session = await response.json();
              const stripe = Stripe("pk_test_51QGlItRvF2XeuAxviPQAtYF18cKUpN9WCn4AhgDO9Y1zCOq4INPgiFw55WDc3xZfj19D2cNFo4mxRh2voYtBvqRz00C0yR9HS7"); // Replace with your own test key
              stripe.redirectToCheckout({ sessionId: session.id });
            } catch (error) {
              console.error('Error:', error);
            }
          });
        } else {
          console.error('Checkout button not found');
        }
      });
    </script>
  </body>
</html>
