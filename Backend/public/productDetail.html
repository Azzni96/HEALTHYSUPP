<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Example Vite PWA">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" sizes="192x192">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Product Details - HEALTHYSUPP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script type="module" crossorigin src="./assets/main-Ba8Nt-5-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DSwa66gG.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <header class="header">
        <a href="index.html" class="logo">
          <img src="./assets/healthysupp_logoff-n7rpy2c_.jpg" alt="logo">
        </a>
        <nav class="navbar">
          <a href="index.html">Home</a>
          <a href="Menu.html">Shopping</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <div class="icons">
          <div class="fas fa-user" id="user-btn"></div>
          <div class="fas fa-shopping-cart" id="cart-btn"></div>
          <span class="quantity">0</span>
          <div class="fas fa-search" id="search-btn"></div>
          <div class="fas fa-bars" id="menu-btn"></div>
          <div class="logbar">
            <div id="username-display" style="display: none;"></div>
            <!--<div>
              <button><div class="fas fa-right-to-bracket" id="LoginBtn"> register</div></button>
              <button id="logoutbtn" onclick="logout()" class="active">
              <div class="fas fa-right-from-bracket" id="log">Logout</div>
              </button></div>
          </div> -->
        </div>
        <div class="search-form">
          <input type="search" id="search-box" placeholder="search here...">
          <label for="search-box" class="fas fa-search"></label>
        </div>
        <div class="cart-items-container">
          <h1>Card</h1>
          <ul class="listCard"></ul>
          <div class="cart-actions">
            <button id="clear-cart">Tyhjennä Ostoskori</button>
            <button id="checkout">Maksaminen</button>
          </div>
          <div class="checkOut">
            <div class="total">0</div>
            <div class="closeShopping">Close</div>
          </div>
        </div>
    </header>


    <section id="product-section">
      <div id="product-list"></div> <!-- This should match the ID used in your code -->
    </section>

    <footer>
      <div class="footer-container">
        <div class="footer-logo">
          <img src="./assets/healthysupp_logoff-n7rpy2c_.jpg" alt="logo">
        </div>
        <div class="footer-social">
          <a href="#"><img src="./assets/facebook-ejnf6rkB.png" alt="Facebook"></a>
          <a href="#"><img src="./assets/twitter-CPWSm0NQ.png" alt="X (formerly Twitter)"></a>
          <a href="#"><img src="./assets/instagram-BT1rpC5A.png" alt="Instagram"></a>
          <a href="#"><img src="./assets/linkedin-DYsRWqBD.png" alt="LinkedIn"></a>
        </div>
        <div class="footer-text">
          <p>
            &copy; 2021 HEALTHYSUPP. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
