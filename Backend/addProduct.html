<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Product</title>
</head>
<body>
  <header>
    <h1>Customer Feedback</h1>
  </header>
  <style>
      table {
          width: 100%;
          border-collapse:separate;
          margin: 20px 0;
        }

        table, th, td {
          border: 1px solid #000;
        }

        th, td {
          padding: 5px;
          text-align: center;
        }

        th {
          background-color: #f4f4f4;
        }

  </style>
  <main>
    <section id="feedback-list"></section>
    <h2>All Feedback</h2>
    <ul id="feedback-container"></ul>
  </main>
  <section id="payment-list">
    <h2>Payment History</h2>
    <table>
      <thead>
        <tr>
          <th>Cardholder Name</th>
          <th>Email</th>
          <th>Total</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="payment-table-body">
        <!-- Payments will be dynamically added here -->
      </tbody>
    </table>
  </section>

  <h1>Add a New Product, feedback List</h1>
  <form id="product-form" enctype="multipart/form-data">
    <input type="text" id="name" name="name" placeholder="Product Name" required>
    <input type="number" id="price" name="price" placeholder="Price" required min="0">
    <input type="number" id="discount" name="discount" placeholder="Discount %" min="0" max="100">
    <textarea id="description" name="description" placeholder="Description"></textarea>
    <input type="file" id="images" name="images" multiple accept="image/*">
    <input type="text" id="category" name="category" placeholder="Category" required>
    <button type="submit">Add Product</button>
  </form>

  <script>
    document.getElementById('product-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const formData = new FormData(document.getElementById('product-form'));

      try {
        const response = await fetch('http://localhost:3000/api/products', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          alert('Product added successfully!');
          document.getElementById('product-form').reset();
        } else {
          const errorData = await response.json();
          alert('Failed to add product: ' + (errorData.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred: ' + error.message);
      }
    });
  </script>
  <script type="module" src="/src/feedback.ts"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
