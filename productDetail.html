<!-- productDetail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Detail</title>
    <link rel="stylesheet" href="./public/main.css">
</head>
<body>
    <header>
        <h1 id="product-name"></h1>
        <button onclick="goBack()">Go Back</button>
    </header>
    <section>
        <img id="product-image" src="" alt="Product Image">
        <p id="product-description"></p>
        <p id="product-price"></p>
        <p id="product-discount"></p>
    </section>

    <script>
        function goBack() {
            window.history.back();
        }

        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Fetch product details from the server
        async function fetchProductDetails() {
            const response = await fetch(`http://localhost:3000/api/products/${productId}`);
            if (response.ok) {
                const product = await response.json();
                document.getElementById('product-name').innerText = product.name;
                document.getElementById('product-description').innerText = product.description;
                document.getElementById('product-price').innerText = `Price: $${product.price}`;
                document.getElementById('product-discount').innerText = `Discount: ${product.discount}%`;
                document.getElementById('product-image').src = product.image_urls.split(',')[0]; // Display the first image
            } else {
                alert('Failed to load product details.');
            }
        }

        // Call the function to fetch product details
        fetchProductDetails();
    </script>
</body>
</html>
